name: Publish validation vectors

# Publishes the conformance vectors (E12 #113) as a GitHub release asset that
# the KFS-APP CI downloads. Push a tag vectors-<catalogVersion>
# (e.g. vectors-2026-09-30.1) after merging catalog or vector changes.
on:
  push:
    tags: ["vectors-*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches catalogVersion
        run: |
          CATALOG_VERSION=$(python3 -c "import json; print(json.load(open('src/main/resources/croquis/catalog.json'))['catalogVersion'])")
          test "vectors-$CATALOG_VERSION" = "$GITHUB_REF_NAME"

      - name: Package
        id: package
        run: echo "zip=$(scripts/package-validation-vectors.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Validation vectors ${GITHUB_REF_NAME#vectors-}" \
            --notes "Conformance vectors + catalog snapshot + manifest (sha256) for the KFS-APP Dart engine. See docs/specs/e12-site-measurement/113-validation-rules-engine.md."
